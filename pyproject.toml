[project]
name = "phasor-dev"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = ["phasor[data]"]

[tool.uv]
package = false

[tool.uv.sources]
phasor = { path = "crates/phasor-py", editable = true }

[dependency-groups]
research = ["openai>=1", "pymupdf", "pytest>=7", "pyyaml"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
