normal" dominant-baseline="middle">t6</text><rect x="368.0" y="90.0" width="40.0" height="36.0" rx="4" fill="#ddf4ff" stroke="#d1d9e0" stroke-width="1"/><text x="388.0" y="108.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal" dominant-baseline="middle">2.8</text><text x="388.0" y="78.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">t7</text><rect x="412.0" y="90.0" width="40.0" height="36.0" rx="4" fill="#dafbe1" stroke="#d1d9e0" stroke-width="1"/><text x="432.0" y="108.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal" dominant-baseline="middle">3.5</text><text x="432.0" y="78.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">t8</text><rect x="456.0" y="90.0" width="40.0" height="36.0" rx="4" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="476.0" y="108.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal" dominant-baseline="middle">3.1</text><text x="476.0" y="78.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">t9</text><path d="M236.0,134.0 v6 H452.0 v-6" fill="none" stroke="#0969da" stroke-width="1.2"/><text x="344.0" y="149.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#0969da" text-anchor="middle" font-weight="normal" dominant-baseline="middle">窗口 N = 5</text><path d="M212,130 C212,200 192,220 236,230" fill="none" stroke="#cf222e" stroke-width="1.4" marker-end="url(#arrow)"/><text x="198.0" y="200.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#cf222e" text-anchor="end" font-weight="normal" dominant-baseline="middle">移除</text><path d="M432,130 C432,200 368,220 324,230" fill="none" stroke="#1a7f37" stroke-width="1.4" marker-end="url(#arrow)"/><text x="438.0" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#1a7f37" text-anchor="start" font-weight="normal" dominant-baseline="middle">加入</text><rect x="148.0" y="230.0" width="304.0" height="50.0" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/><text x="300.0" y="247.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#0969da" text-anchor="middle" font-weight="600" dominant-baseline="middle">累加器</text><text x="300.0" y="265.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#59636e" text-anchor="middle" font-weight="normal" dominant-baseline="middle">count · Σ(x−shift) · Σ(x−shift)²</text><text x="560.0" y="100.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" dominant-baseline="middle">• 每 N 行重建</text><text x="572.0" y="120.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal" dominant-baseline="middle">舍入漂移最多累积两个窗口</text><text x="560.0" y="148.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" dominant-baseline="middle">• 平移求和</text><text x="572.0" y="168.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal" dominant-baseline="middle">以窗口内某个值为基准</text><text x="560.0" y="196.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" dominant-baseline="middle">• 精确的常数窗口</text><text x="572.0" y="216.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal" dominant-baseline="middle">值全相同 → 方差精确为 0</text><text x="560.0" y="244.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" dominant-baseline="middle">• NaN 占位</text><text x="572.0" y="264.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal" dominant-baseline="middle">但不参与求和</text><text x="500.0" y="36.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600" dominant-baseline="middle">每一行：加入进入的值，移除离开的值——O(1)</text></svg>
