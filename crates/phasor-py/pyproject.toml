[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "phasor"
description = "A vectorized backtesting engine, in Rust"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.scripts]
phasor = "phasor.cli:main"

[project.optional-dependencies]
data = ["pyarrow>=15"]
plot = ["plotly>=5"]
pandas = ["pandas>=1.5"]
config = ["tomli>=2; python_version < '3.11'"]
test = ["pytest>=7"]

[tool.maturin]
# The Rust extension is built as `phasor._phasor` and the Python shell in
# `python/phasor/` is packaged around it. One wheel, two layers.
module-name = "phasor._phasor"
python-source = "python"
