[package]
name = "phasor-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for phasor"

[lints]
workspace = true

[lib]
name = "_phasor"
crate-type = ["cdylib", "rlib"]

[dependencies]
phasor-data.workspace = true
arrow-array = { workspace = true, features = ["ffi"] }
arrow-schema = { workspace = true, features = ["ffi"] }

phasor-analysis = { workspace = true }
phasor-core = { workspace = true }
phasor-expr = { workspace = true }
phasor-generic = { workspace = true }
phasor-model = { workspace = true }
phasor-records = { workspace = true }
phasor-signals = { workspace = true }
phasor-sim = { workspace = true }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

[build-dependencies]
pyo3-build-config = "0.29"
