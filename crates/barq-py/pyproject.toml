[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "barq"
description = "A vectorized backtesting engine, in Rust"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.optional-dependencies]
# The reference, for the differential tests. Not needed to use the package —
# and pinned, because the tests assert what this version does, including which
# size types it refuses.
test = ["pytest>=7", "vectorbt==1.1.0"]

[tool.maturin]
# The Rust extension is built as `barq._barq` and the Python shell in
# `python/barq/` is packaged around it. One wheel, two layers.
module-name = "barq._barq"
python-source = "python"
