[package]
name = "barq-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for barq"

[lints]
workspace = true

[lib]
name = "_barq"
crate-type = ["cdylib", "rlib"]

[dependencies]
barq-data.workspace = true
arrow-array = { workspace = true, features = ["ffi"] }
arrow-schema = { workspace = true, features = ["ffi"] }

barq-analysis = { workspace = true }
barq-core = { workspace = true }
barq-expr = { workspace = true }
barq-generic = { workspace = true }
barq-model = { workspace = true }
barq-records = { workspace = true }
barq-sim = { workspace = true }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

[build-dependencies]
pyo3-build-config = "0.29"
